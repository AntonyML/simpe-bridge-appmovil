name: Android CI CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  VERSION_PREFIX: "v"

jobs:
  versioning:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.bump.outputs.version_name }}
      version_code: ${{ steps.bump.outputs.version_code }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
      tag_exists: ${{ steps.bump.outputs.tag_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute semantic version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_tag=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
          latest_tag=${latest_tag:-v0.0.0}

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"
          next_patch=$((patch + 1))
          version_name="${major}.${minor}.${next_patch}"
          tag_name="v${version_name}"

          version_code="${GITHUB_RUN_NUMBER}"

          tag_exists="false"
          if git rev-parse "refs/tags/${tag_name}" >/dev/null 2>&1; then
            tag_exists="true"
          fi

          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"

          echo "Resolved version_name=${version_name}"
          echo "Resolved version_code=${version_code}"
          echo "Resolved tag_name=${tag_name}"

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: versioning
    env:
      VERSION_NAME: ${{ needs.versioning.outputs.version_name }}
      VERSION_CODE: ${{ needs.versioning.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build and test
        run: |
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace \
            -PVERSION_NAME=${VERSION_NAME} -PVERSION_CODE=${VERSION_CODE}

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

  sign:
    name: Sign APK
    runs-on: ubuntu-latest
    needs: [versioning, build]
    outputs:
      apk_name: ${{ steps.export.outputs.apk_name }}
    steps:
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: unsigned-release-apk
          path: unsigned

      - name: Resolve APK file
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_file=$(find unsigned -name "*.apk" | head -1)
          if [ -z "${apk_file}" ]; then
            echo "No APK found"
            exit 1
          fi
          echo "file=${apk_file}" >> "$GITHUB_OUTPUT"

      - name: Resolve apksigner
        id: apksigner
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner_path=$(find "${sdk_root}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${apksigner_path}" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "build-tools;36.0.0"
            apksigner_path=$(find "${sdk_root}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "${apksigner_path}" ]; then
            echo "Unable to find apksigner"
            exit 1
          fi
          echo "path=${apksigner_path}" >> "$GITHUB_OUTPUT"

      - name: Sign if keystore secrets are present
        id: sign
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version_name="${{ needs.versioning.outputs.version_name }}"
          output_apk="simpe-bridge-${version_name}.apk"

          if [ -n "${ANDROID_KEYSTORE}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "${ANDROID_KEYSTORE}" | base64 -d > release-keystore.jks
            "${{ steps.apksigner.outputs.path }}" sign \
              --ks release-keystore.jks \
              --ks-pass pass:"${KEYSTORE_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass pass:"${KEY_PASSWORD}" \
              --out "${output_apk}" \
              "${{ steps.apk.outputs.file }}"
            "${{ steps.apksigner.outputs.path }}" verify --verbose "${output_apk}"
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            cp "${{ steps.apk.outputs.file }}" "${output_apk}"
            echo "mode=unsigned-fallback" >> "$GITHUB_OUTPUT"
          fi

          echo "output=${output_apk}" >> "$GITHUB_OUTPUT"

      - name: Export output name
        id: export
        run: echo "apk_name=${{ steps.sign.outputs.output }}" >> "$GITHUB_OUTPUT"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: final-apk
          path: ${{ steps.sign.outputs.output }}
          retention-days: 30

  release:
    name: Create Tag and Release
    runs-on: ubuntu-latest
    needs: [versioning, sign]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final APK
        uses: actions/download-artifact@v4
        with:
          name: final-apk
          path: release-assets

      - name: Create and push tag when missing
        if: needs.versioning.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.versioning.outputs.tag_name }}"
          git push origin "${{ needs.versioning.outputs.tag_name }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.tag_name }}
          name: Simpe Bridge ${{ needs.versioning.outputs.tag_name }}
          body: |
            Android build autogenerated on push to main.

            Version:
            - versionName: ${{ needs.versioning.outputs.version_name }}
            - versionCode: ${{ needs.versioning.outputs.version_code }}

            Artifact:
            - ${{ needs.sign.outputs.apk_name }}
          files: release-assets/*.apk
          draft: false
          prerelease: false
