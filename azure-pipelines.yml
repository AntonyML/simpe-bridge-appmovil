trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  JAVA_VERSION: '17'
  GRADLE_USER_HOME: $(Pipeline.Workspace)/.gradle

# ─────────────────────────────────────────────
# STAGE 1 — VERSIONING
# ─────────────────────────────────────────────
stages:
- stage: Versioning
  displayName: 'Resolve Version'
  jobs:
  - job: ResolveVersion
    displayName: 'Compute Semantic Version'
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        set -euo pipefail

        git fetch --tags --force

        latest_tag=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
        latest_tag=${latest_tag:-v0.0.0}

        version="${latest_tag#v}"
        IFS='.' read -r major minor patch <<< "$version"
        next_patch=$((patch + 1))
        version_name="${major}.${minor}.${next_patch}"
        tag_name="v${version_name}"
        version_code="$(Build.BuildId)"

        echo "##vso[task.setvariable variable=VERSION_NAME;isOutput=true]${version_name}"
        echo "##vso[task.setvariable variable=VERSION_CODE;isOutput=true]${version_code}"

        echo "version_name=${version_name}"
        echo "version_code=${version_code}"
      name: bump
      displayName: 'Compute semantic version'

# ─────────────────────────────────────────────
# STAGE 2 — BUILD
# ─────────────────────────────────────────────
- stage: Build
  displayName: 'Build APK'
  dependsOn: Versioning
  variables:
    VERSION_NAME: $[ stageDependencies.Versioning.ResolveVersion.outputs['bump.VERSION_NAME'] ]
    VERSION_CODE: $[ stageDependencies.Versioning.ResolveVersion.outputs['bump.VERSION_CODE'] ]
  jobs:
  - job: BuildAPK
    displayName: 'Build Release APK'
    steps:
    - checkout: self
      fetchDepth: 0

    - task: Cache@2
      displayName: 'Cache Gradle dependencies'
      inputs:
        key: 'gradle | "$(Agent.OS)" | **/build.gradle* | **/gradle-wrapper.properties'
        restoreKeys: |
          gradle | "$(Agent.OS)"
        path: $(GRADLE_USER_HOME)

    - task: JavaToolInstaller@0
      displayName: 'Setup Java 17'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: |
        java -version
        chmod +x gradlew
      displayName: 'Verify Java and grant gradlew permission'

    - script: |
        ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleRelease \
          --no-daemon \
          --stacktrace \
          -PVERSION_NAME=$(VERSION_NAME) \
          -PVERSION_CODE=$(VERSION_CODE)
      displayName: 'Lint, test and build release APK'

    - task: PublishTestResults@2
      displayName: 'Publish unit test results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/TEST-*.xml'
        mergeTestResults: true
        failTaskOnFailedTests: true

    - task: PublishPipelineArtifact@1
      displayName: 'Upload release APK'
      inputs:
        targetPath: 'app/build/outputs/apk/release'
        artifact: 'release-apk'
        publishLocation: 'pipeline'

    - task: UniversalPackages@0
      displayName: 'Publish APK to Artifacts feed'
      inputs:
        command: 'publish'
        publishDirectory: 'app/build/outputs/apk/release'
        feedsToUsePublish: 'internal'
        vstsFeedPublish: 'ANTONYMONGELOPEZ'
        vstsFeedPackagePublish: 'simpe-bridge-apk'
        versionOption: 'custom'
        versionPublish: '$(VERSION_NAME)'

    - script: |
        APK_URL="https://github.com/AntonyML/simpe-bridge-appmovil/releases/download/v$(VERSION_NAME)/simpe-bridge-$(VERSION_NAME).apk"
        RELEASE_URL="https://github.com/AntonyML/simpe-bridge-appmovil/releases/tag/v$(VERSION_NAME)"

